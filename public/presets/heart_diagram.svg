<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="20" width="740" height="52" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">HUMAN HEART ANATOMY</text>
  <text x="50" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Cardiovascular System • Internal Coronal Chamber Cross-Section • 2D Textbook Schematic Reference</text>
  <rect x="680" y="32" width="75" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="717" y="49" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">TEXTBOOK</text>

  <!-- Main Diagram Graphics -->
  
  <!-- Major Vessels -->
  <!-- Superior Vena Cava (Blue) -->
  <path d="M 330,110 L 330,220 C 330,240 310,250 310,270 L 290,270 L 290,110 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="260" y="140" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#60a5fa">Superior Vena Cava</text>
  <line x1="285" y1="145" x2="310" y2="160" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- Aorta &amp; Arch (Red) -->
  <path d="M 370,100 C 370,80 430,80 440,110 C 450,140 450,210 440,240 L 400,240 C 410,200 410,130 400,120 C 390,110 380,115 375,130 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
  <rect x="385" y="85" width="12" height="25" fill="#dc2626"/>
  <rect x="405" y="80" width="12" height="30" fill="#dc2626"/>
  <rect x="425" y="85" width="12" height="25" fill="#dc2626"/>
  <text x="470" y="110" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f87171">Aorta &amp; Branches</text>
  <line x1="465" y1="115" x2="430" y2="115" stroke="#f87171" stroke-width="1.5"/>

  <!-- Pulmonary Artery (Blue-Violet) -->
  <path d="M 360,150 C 350,170 350,210 360,250 L 410,250 C 400,210 400,170 410,150 C 430,150 480,160 500,170 L 500,140 C 460,135 430,130 410,140 L 360,150 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="510" y="165" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#93c5fd">Pulmonary Trunk</text>
  <line x1="505" y1="165" x2="460" y2="155" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Outer Heart Wall Outline -->
  <path d="M 280,240 C 230,260 220,380 270,430 C 320,480 390,530 410,540 C 430,530 540,460 560,370 C 580,280 520,230 450,240 C 420,245 390,255 365,250 Z" fill="#881337" stroke="#e11d48" stroke-width="3"/>

  <!-- Right Atrium Interior (Blue - Deoxygenated) -->
  <path d="M 270,270 C 250,290 250,330 280,350 L 330,350 C 340,320 340,280 330,270 Z" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="170" y="310" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#60a5fa">Right Atrium</text>
  <text x="170" y="326" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Receives Venous Blood</text>
  <line x1="245" y1="315" x2="280" y2="315" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- Left Atrium Interior (Red - Oxygenated) -->
  <path d="M 430,270 C 450,270 480,290 490,320 C 490,340 470,360 440,360 L 410,350 C 410,310 420,280 430,270 Z" fill="#991b1b" stroke="#ef4444" stroke-width="2"/>
  <text x="540" y="310" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f87171">Left Atrium</text>
  <text x="540" y="326" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Receives Pulm. Veins</text>
  <line x1="535" y1="315" x2="470" y2="315" stroke="#f87171" stroke-width="1.5"/>

  <!-- Tricuspid Valve -->
  <line x1="290" y1="355" x2="330" y2="355" stroke="#facc15" stroke-width="3" stroke-dasharray="4,2"/>
  <text x="160" y="375" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#facc15">Tricuspid Valve</text>
  <line x1="240" y1="370" x2="305" y2="360" stroke="#facc15" stroke-width="1.5"/>

  <!-- Bicuspid / Mitral Valve -->
  <line x1="420" y1="355" x2="460" y2="355" stroke="#facc15" stroke-width="3" stroke-dasharray="4,2"/>
  <text x="540" y="375" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#facc15">Bicuspid (Mitral) Valve</text>
  <line x1="535" y1="370" x2="445" y2="360" stroke="#facc15" stroke-width="1.5"/>

  <!-- Interventricular Septum (Muscular Wall) -->
  <path d="M 370,350 L 375,500 L 405,505 L 400,350 Z" fill="#4c0519" stroke="#9f1239" stroke-width="2"/>
  <text x="390" y="470" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#f43f5e" text-anchor="middle">Septum</text>

  <!-- Right Ventricle (Blue) -->
  <path d="M 280,370 C 280,430 330,470 365,480 L 365,370 Z" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="170" y="430" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#60a5fa">Right Ventricle</text>
  <text x="170" y="446" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Pumps to Lungs</text>
  <line x1="255" y1="435" x2="310" y2="430" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- Left Ventricle (Thick Myocardium - Red) -->
  <path d="M 405,370 L 405,480 C 430,470 480,440 480,370 Z" fill="#991b1b" stroke="#ef4444" stroke-width="2"/>
  <!-- Extra thick muscular wall -->
  <path d="M 480,370 C 490,440 440,495 410,515 C 440,510 520,460 525,370 Z" fill="#be123c"/>
  <text x="540" y="430" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f87171">Left Ventricle</text>
  <text x="540" y="446" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Thick Myocardium • Systemic</text>
  <line x1="535" y1="435" x2="455" y2="430" stroke="#f87171" stroke-width="1.5"/>

  <!-- Apex of the Heart -->
  <circle cx="410" cy="535" r="4" fill="#fb7185"/>
  <text x="410" y="565" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#fb7185" text-anchor="middle">Apex of Heart</text>


  <!-- Footer Watermark / Standard Info -->
  <line x1="30" y1="565" x2="770" y2="565" stroke="#334155" stroke-width="1" />
  <text x="40" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">AI Spatial Learning Platform • Curated Educational Reference Series</text>
  <text x="760" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Standard Syllabus Geometry</text>
</svg>