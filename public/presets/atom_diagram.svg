<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="20" width="740" height="52" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">BOHR MODEL ATOMIC SHELLS</text>
  <text x="50" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Chemistry &amp; Atomic Structure • Electron Shell Quantization &amp; Nucleus • 2D Textbook Schematic Reference</text>
  <rect x="680" y="32" width="75" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="717" y="49" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">TEXTBOOK</text>

  <!-- Main Diagram Graphics -->
  
  <!-- Energy Shell Orbits (Concentric Rings) -->

  <!-- K-Shell (n=1) -->
  <circle cx="400" cy="320" r="75" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="400" y="240" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">K-Shell (n=1 • max 2 e⁻)</text>

  <!-- L-Shell (n=2) -->
  <circle cx="400" cy="320" r="140" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="400" y="170" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#818cf8" text-anchor="middle">L-Shell (n=2 • max 8 e⁻)</text>

  <!-- M-Shell (n=3) -->
  <circle cx="400" cy="320" r="200" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="400" y="110" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">M-Shell (n=3 • Valence)</text>

  <!-- Central Nucleus (Cluster of Protons and Neutrons) -->
  <circle cx="400" cy="320" r="32" fill="#831843" stroke="#f43f5e" stroke-width="3"/>
  <!-- Protons (Red p+) -->
  <circle cx="392" cy="312" r="8" fill="#ef4444"/>
  <circle cx="408" cy="328" r="8" fill="#ef4444"/>
  <!-- Neutrons (Gray n0) -->
  <circle cx="408" cy="312" r="8" fill="#64748b"/>
  <circle cx="392" cy="328" r="8" fill="#64748b"/>
  <text x="260" y="325" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fb7185">Central Nucleus</text>
  <text x="260" y="341" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">Protons (p⁺) &amp; Neutrons (n⁰)</text>
  <line x1="330" y1="325" x2="368" y2="320" stroke="#fb7185" stroke-width="1.5"/>

  <!-- K-Shell Electrons (2 electrons) -->
  <circle cx="400" cy="245" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="400" cy="395" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

  <!-- L-Shell Electrons (8 electrons) -->
  <circle cx="400" cy="180" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="400" cy="460" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="260" cy="320" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="540" cy="320" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="301" cy="221" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="499" cy="221" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="301" cy="419" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="499" cy="419" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>

  <!-- M-Shell Valence Electron (Sample 1 electron) -->
  <circle cx="400" cy="120" r="7" fill="#c084fc" stroke="#facc15" stroke-width="2.5"/>
  <text x="560" y="125" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#c084fc">Valence Electron (e⁻)</text>
  <line x1="550" y1="125" x2="415" y2="120" stroke="#c084fc" stroke-width="1.5"/>

  <!-- Quantized Energy Formula Inset -->
  <rect x="60" y="440" width="180" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="150" y="465" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Bohr Radius Formula</text>
  <text x="150" y="488" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#facc15" text-anchor="middle">rₙ = n² · a₀</text>
  <text x="150" y="508" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Quantized Orbital Radii</text>


  <!-- Footer Watermark / Standard Info -->
  <line x1="30" y1="565" x2="770" y2="565" stroke="#334155" stroke-width="1" />
  <text x="40" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">AI Spatial Learning Platform • Curated Educational Reference Series</text>
  <text x="760" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Standard Syllabus Geometry</text>
</svg>