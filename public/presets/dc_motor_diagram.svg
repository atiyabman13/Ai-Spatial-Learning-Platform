<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="20" width="740" height="52" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">DC ELECTRIC MOTOR SCHEMATIC</text>
  <text x="50" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Physics &amp; Electromagnetism • Stator, Armature, Commutator &amp; Lorentz Torque • 2D Textbook Schematic Reference</text>
  <rect x="680" y="32" width="75" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="717" y="49" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">TEXTBOOK</text>

  <!-- Main Diagram Graphics -->
  
  <!-- North Magnetic Stator (Red, Left) -->
  <rect x="120" y="180" width="100" height="240" rx="6" fill="#dc2626" stroke="#b91c1c" stroke-width="3"/>
  <text x="170" y="310" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>
  <text x="170" y="155" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">North Stator Magnet</text>

  <!-- South Magnetic Stator (Blue, Right) -->
  <rect x="580" y="180" width="100" height="240" rx="6" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/>
  <text x="630" y="310" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
  <text x="630" y="155" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">South Stator Magnet</text>

  <!-- Magnetic Field Lines (B-field Green arrows from N to S) -->
  <line x1="225" y1="220" x2="575" y2="220" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="575,220 565,215 565,225" fill="#22c55e"/>

  <line x1="225" y1="280" x2="575" y2="280" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="575,280 565,275 565,285" fill="#22c55e"/>

  <line x1="225" y1="340" x2="575" y2="340" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="575,340 565,335 565,345" fill="#22c55e"/>

  <line x1="225" y1="380" x2="575" y2="380" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="575,380 565,375 565,385" fill="#22c55e"/>
  <text x="400" y="205" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">Magnetic Field (B-Field: N → S)</text>

  <!-- Rotating Armature Coil (Copper Loop in center) -->
  <rect x="290" y="240" width="220" height="140" fill="none" stroke="#d97706" stroke-width="8" stroke-linejoin="round"/>
  <text x="400" y="295" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#f59e0b" text-anchor="middle">Armature Coil Loop</text>
  <text x="400" y="315" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fde68a" text-anchor="middle">Lorentz Force (F = I × B)</text>

  <!-- Force Vector Arrows (Torque Direction) -->
  <line x1="310" y1="230" x2="310" y2="185" stroke="#ec4899" stroke-width="4"/>
  <polygon points="310,180 305,190 315,190" fill="#ec4899"/>
  <text x="310" y="170" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f472b6" text-anchor="middle">Force Up (F↑)</text>

  <line x1="490" y1="390" x2="490" y2="435" stroke="#ec4899" stroke-width="4"/>
  <polygon points="490,440 485,430 495,430" fill="#ec4899"/>
  <text x="490" y="455" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f472b6" text-anchor="middle">Force Down (F↓)</text>

  <!-- Split-Ring Commutator &amp; Carbon Brushes -->
  <!-- Commutator Half 1 -->
  <path d="M 370,440 C 370,425 400,425 400,440" fill="none" stroke="#eab308" stroke-width="7"/>
  <!-- Commutator Half 2 -->
  <path d="M 405,440 C 405,425 435,425 435,440" fill="none" stroke="#eab308" stroke-width="7"/>
  <text x="400" y="475" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#facc15" text-anchor="middle">Split-Ring Commutator</text>

  <!-- Carbon Brushes -->
  <rect x="355" y="435" width="12" height="15" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="438" y="435" width="12" height="15" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="290" y="450" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Carbon Brush</text>

  <!-- DC Power Supply / Battery Circuit -->
  <line x1="360" y1="450" x2="360" y2="520" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="360" y1="520" x2="390" y2="520" stroke="#cbd5e1" stroke-width="3"/>

  <line x1="445" y1="450" x2="445" y2="520" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="445" y1="520" x2="415" y2="520" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Battery plates (+ and -) -->
  <line x1="390" y1="510" x2="390" y2="530" stroke="#ef4444" stroke-width="5"/>
  <line x1="415" y1="500" x2="415" y2="540" stroke="#3b82f6" stroke-width="3"/>
  <text x="385" y="550" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#ef4444">-</text>
  <text x="415" y="550" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#3b82f6">+</text>
  <text x="402" y="565" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">DC Power Source</text>


  <!-- Footer Watermark / Standard Info -->
  <line x1="30" y1="565" x2="770" y2="565" stroke="#334155" stroke-width="1" />
  <text x="40" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">AI Spatial Learning Platform • Curated Educational Reference Series</text>
  <text x="760" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Standard Syllabus Geometry</text>
</svg>