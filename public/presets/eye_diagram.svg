<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="20" width="740" height="52" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">HUMAN EYE OPTICS &amp; ANATOMY</text>
  <text x="50" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Sensory Optics • Sagittal Cross-Section with Refractive Ray Paths • 2D Textbook Schematic Reference</text>
  <rect x="680" y="32" width="75" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="717" y="49" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">TEXTBOOK</text>

  <!-- Main Diagram Graphics -->
  
  <!-- Sclera / Outer Eye Globe -->
  <circle cx="440" cy="320" r="170" fill="#0f172a" stroke="#475569" stroke-width="6"/>

  <!-- Retina Layer (Inner Orange/Red curve) -->
  <path d="M 370,165 C 530,175 590,240 590,320 C 590,400 530,465 370,475" fill="none" stroke="#ea580c" stroke-width="5"/>
  <text x="640" y="270" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fb923c">Retina (Photoreceptors)</text>
  <text x="640" y="286" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fed7aa">Rods &amp; Cones Layer</text>
  <line x1="630" y1="280" x2="585" y2="295" stroke="#fb923c" stroke-width="1.5"/>

  <!-- Fovea Centralis -->
  <circle cx="590" cy="320" r="6" fill="#facc15"/>
  <text x="640" y="325" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#facc15">Fovea Centralis</text>
  <text x="640" y="340" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fde047">Sharpest Visual Acuity</text>
  <line x1="630" y1="325" x2="598" y2="320" stroke="#facc15" stroke-width="1.5"/>

  <!-- Optic Nerve Exit (CN II) -->
  <path d="M 570,360 L 670,410 L 650,440 L 550,390" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="680" y="435" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Optic Nerve (CN II)</text>
  <line x1="675" y1="430" x2="620" y2="400" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Cornea (Anterior Curved Dome) -->
  <path d="M 280,240 C 210,270 210,370 280,400" fill="none" stroke="#38bdf8" stroke-width="6"/>
  <text x="140" y="260" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Cornea</text>
  <text x="140" y="276" font-family="'Segoe UI', sans-serif" font-size="10" fill="#bae6fd">Primary Refractive Power (70%)</text>
  <line x1="200" y1="280" x2="235" y2="295" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Crystalline Biconvex Lens -->
  <path d="M 330,260 C 350,285 350,355 330,380 C 310,355 310,285 330,260 Z" fill="#0284c7" fill-opacity="0.6" stroke="#7dd3fc" stroke-width="2.5"/>
  <text x="240" y="210" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">Crystalline Lens</text>
  <line x1="270" y1="220" x2="320" y2="265" stroke="#7dd3fc" stroke-width="1.5"/>

  <!-- Iris &amp; Pupil Aperture -->
  <rect x="315" y="235" width="20" height="25" rx="3" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="315" y="380" width="20" height="25" rx="3" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
  <text x="190" y="370" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#2dd4bf">Iris &amp; Pupil</text>
  <line x1="240" y1="365" x2="315" y2="330" stroke="#2dd4bf" stroke-width="1.5"/>

  <!-- Vitreous Chamber -->
  <text x="440" y="350" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Vitreous Body (Humor)</text>

  <!-- Incident Light Rays (Yellow Refraction Lines) -->
  <line x1="60" y1="280" x2="235" y2="295" stroke="#facc15" stroke-width="2"/>
  <line x1="235" y1="295" x2="320" y2="305" stroke="#facc15" stroke-width="2"/>
  <line x1="320" y1="305" x2="590" y2="320" stroke="#facc15" stroke-width="2.5" stroke-dasharray="5,2"/>

  <line x1="60" y1="360" x2="235" y2="345" stroke="#facc15" stroke-width="2"/>
  <line x1="235" y1="345" x2="320" y2="335" stroke="#facc15" stroke-width="2"/>
  <line x1="320" y1="335" x2="590" y2="320" stroke="#facc15" stroke-width="2.5" stroke-dasharray="5,2"/>
  <text x="70" y="315" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#facc15">Incident Light Rays</text>


  <!-- Footer Watermark / Standard Info -->
  <line x1="30" y1="565" x2="770" y2="565" stroke="#334155" stroke-width="1" />
  <text x="40" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">AI Spatial Learning Platform • Curated Educational Reference Series</text>
  <text x="760" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Standard Syllabus Geometry</text>
</svg>