<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="20" width="740" height="52" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">MITOTIC CELL DIVISION PHASES</text>
  <text x="50" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Cytology &amp; Cell Cycle • Prophase, Metaphase, Anaphase, Telophase • 2D Textbook Schematic Reference</text>
  <rect x="680" y="32" width="75" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="717" y="49" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">TEXTBOOK</text>

  <!-- Main Diagram Graphics -->
  
  <!-- 4 Stage Panels -->

  <!-- Panel 1: PROPHASE -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="150" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">1. PROPHASE</text>
    <circle cx="75" cy="180" r="55" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <!-- Condensing Chromosomes -->
    <path d="M 60,165 L 75,180 L 60,195 M 75,180 L 90,165 M 75,180 L 90,195" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <circle cx="45" cy="140" r="4" fill="#facc15"/>
    <circle cx="105" cy="140" r="4" fill="#facc15"/>
    <text x="75" y="270" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Chromosomes Condense</text>
    <text x="75" y="290" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Centrosomes Migrate</text>
    <text x="75" y="310" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Nuclear Envelope Dissolves</text>
  </g>

  <!-- Panel 2: METAPHASE -->
  <g transform="translate(230, 120)">
    <rect x="0" y="0" width="150" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">2. METAPHASE</text>
    <circle cx="75" cy="180" r="55" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <!-- Spindle fibers to equator -->
    <line x1="75" y1="130" x2="75" y2="160" stroke="#facc15" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="75" y1="230" x2="75" y2="200" stroke="#facc15" stroke-width="1.5" stroke-dasharray="2,2"/>
    <!-- Equatorial alignment -->
    <line x1="30" y1="180" x2="120" y2="180" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="50" y="174" width="50" height="12" rx="3" fill="#ec4899" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="75" y="270" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Equatorial Plate</text>
    <text x="75" y="290" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Chromosomes Align</text>
    <text x="75" y="310" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Kinetochore Attachment</text>
  </g>

  <!-- Panel 3: ANAPHASE -->
  <g transform="translate(400, 120)">
    <rect x="0" y="0" width="150" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="75" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">3. ANAPHASE</text>
    <ellipse cx="75" cy="180" rx="58" ry="50" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <!-- Sister chromatids pulled apart -->
    <path d="M 60,155 L 75,165 L 90,155" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60,205 L 75,195 L 90,205" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <!-- Spindle fibers pulling -->
    <line x1="75" y1="135" x2="75" y2="155" stroke="#facc15" stroke-width="1.5"/>
    <line x1="75" y1="225" x2="75" y2="205" stroke="#facc15" stroke-width="1.5"/>
    <text x="75" y="270" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Sister Chromatids</text>
    <text x="75" y="290" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Pulled to Opposite Poles</text>
    <text x="75" y="310" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Microtubules Shorten</text>
  </g>

  <!-- Panel 4: TELOPHASE &amp; CYTOKINESIS -->
  <g transform="translate(570, 120)">
    <rect x="0" y="0" width="170" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="85" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">4. TELOPHASE</text>
    <!-- Cleavage Furrow pinching into 2 daughter cells -->
    <path d="M 40,140 C 40,110 130,110 130,140 C 120,175 120,185 130,220 C 130,250 40,250 40,220 C 50,185 50,175 40,140 Z" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="85" cy="145" r="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="85" cy="215" r="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="85" y="270" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Cleavage Furrow</text>
    <text x="85" y="290" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Two Daughter Nuclei Form</text>
    <text x="85" y="310" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Cytokinesis Divides Cell</text>
  </g>


  <!-- Footer Watermark / Standard Info -->
  <line x1="30" y1="565" x2="770" y2="565" stroke="#334155" stroke-width="1" />
  <text x="40" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">AI Spatial Learning Platform • Curated Educational Reference Series</text>
  <text x="760" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Standard Syllabus Geometry</text>
</svg>