<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="20" width="740" height="52" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">DNA DOUBLE HELIX STRUCTURE</text>
  <text x="50" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Molecular Genetics • B-DNA Antiparallel Sugar-Phosphate Strands • 2D Textbook Schematic Reference</text>
  <rect x="680" y="32" width="75" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="717" y="49" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">TEXTBOOK</text>

  <!-- Main Diagram Graphics -->
  
  <!-- Strand 1 (Red/Orange Backbone 5' -> 3') -->
  <path d="M 280,110 Q 320,180 400,200 T 520,290 T 400,380 T 280,470 T 400,550" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <text x="240" y="115" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f97316">5' End</text>

  <!-- Strand 2 (Cyan/Blue Backbone 3' -> 5') -->
  <path d="M 520,110 Q 480,180 400,200 T 280,290 T 400,380 T 520,470 T 400,550" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round"/>
  <text x="540" y="115" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#06b6d4">3' End</text>

  <!-- Base Pairs Bridges (A=T 2 H-bonds, G≡C 3 H-bonds) -->
  <!-- Level 1 -->
  <line x1="300" y1="140" x2="400" y2="140" stroke="#22c55e" stroke-width="4"/>
  <line x1="400" y1="140" x2="500" y2="140" stroke="#eab308" stroke-width="4"/>
  <circle cx="400" cy="140" r="3" fill="#ffffff"/>

  <!-- Level 2 -->
  <line x1="340" y1="170" x2="400" y2="170" stroke="#3b82f6" stroke-width="4"/>
  <line x1="400" y1="170" x2="460" y2="170" stroke="#ef4444" stroke-width="4"/>

  <!-- Node crossing at 200 -->
  <circle cx="400" cy="200" r="6" fill="#a855f7"/>

  <!-- Level 3 -->
  <line x1="340" y1="230" x2="400" y2="230" stroke="#ef4444" stroke-width="4"/>
  <line x1="400" y1="230" x2="460" y2="230" stroke="#3b82f6" stroke-width="4"/>

  <!-- Level 4 -->
  <line x1="300" y1="260" x2="400" y2="260" stroke="#eab308" stroke-width="4"/>
  <line x1="400" y1="260" x2="500" y2="260" stroke="#22c55e" stroke-width="4"/>
  <circle cx="400" cy="260" r="3" fill="#ffffff"/>

  <!-- Level 5 (Major Groove widest) -->
  <line x1="285" y1="290" x2="400" y2="290" stroke="#22c55e" stroke-width="4"/>
  <line x1="400" y1="290" x2="515" y2="290" stroke="#eab308" stroke-width="4"/>
  <text x="600" y="295" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Major Groove</text>
  <line x1="590" y1="295" x2="525" y2="290" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Level 6 -->
  <line x1="300" y1="320" x2="400" y2="320" stroke="#3b82f6" stroke-width="4"/>
  <line x1="400" y1="320" x2="500" y2="320" stroke="#ef4444" stroke-width="4"/>

  <!-- Node crossing at 380 -->
  <circle cx="400" cy="380" r="6" fill="#a855f7"/>

  <!-- Level 7 (Minor Groove) -->
  <line x1="340" y1="410" x2="400" y2="410" stroke="#22c55e" stroke-width="4"/>
  <line x1="400" y1="410" x2="460" y2="410" stroke="#eab308" stroke-width="4"/>
  <text x="170" y="415" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Minor Groove</text>
  <line x1="240" y1="415" x2="330" y2="410" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Level 8 -->
  <line x1="300" y1="440" x2="400" y2="440" stroke="#ef4444" stroke-width="4"/>
  <line x1="400" y1="440" x2="500" y2="440" stroke="#3b82f6" stroke-width="4"/>

  <!-- Level 9 -->
  <line x1="285" y1="470" x2="400" y2="470" stroke="#22c55e" stroke-width="4"/>
  <line x1="400" y1="470" x2="515" y2="470" stroke="#eab308" stroke-width="4"/>

  <!-- Legend Box -->
  <rect x="580" y="360" width="180" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="670" y="380" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Base Pairing Rules</text>
  
  <rect x="600" y="395" width="14" height="14" fill="#22c55e"/>
  <text x="625" y="407" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Adenine (A)</text>

  <rect x="600" y="415" width="14" height="14" fill="#eab308"/>
  <text x="625" y="427" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Thymine (T)</text>

  <rect x="600" y="435" width="14" height="14" fill="#3b82f6"/>
  <text x="625" y="447" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Cytosine (C)</text>

  <rect x="600" y="455" width="14" height="14" fill="#ef4444"/>
  <text x="625" y="467" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Guanine (G)</text>

  <text x="670" y="485" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#a855f7" text-anchor="middle">A = T (2 bonds) • G ≡ C (3 bonds)</text>


  <!-- Footer Watermark / Standard Info -->
  <line x1="30" y1="565" x2="770" y2="565" stroke="#334155" stroke-width="1" />
  <text x="40" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">AI Spatial Learning Platform • Curated Educational Reference Series</text>
  <text x="760" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Standard Syllabus Geometry</text>
</svg>