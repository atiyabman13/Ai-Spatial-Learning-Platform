<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="20" width="740" height="52" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">HUMAN DIGESTIVE SYSTEM</text>
  <text x="50" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Gastroenterology • Gastrointestinal Tract &amp; Accessory Organs • 2D Textbook Schematic Reference</text>
  <rect x="680" y="32" width="75" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="717" y="49" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">TEXTBOOK</text>

  <!-- Main Diagram Graphics -->
  
  <!-- Esophagus Tube -->
  <rect x="388" y="100" width="24" height="120" rx="4" fill="#b45309" stroke="#f59e0b" stroke-width="2"/>
  <text x="260" y="145" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Esophagus</text>
  <text x="260" y="161" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Peristalsis Conduction</text>
  <line x1="335" y1="150" x2="385" y2="150" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Liver (Large Triangular Organ on Right of anatomical view) -->
  <path d="M 270,220 C 340,210 380,225 385,250 C 390,300 360,330 290,320 C 250,310 240,250 270,220 Z" fill="#78350f" stroke="#d97706" stroke-width="2.5"/>
  <text x="170" y="260" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f59e0b">Liver (Hepar)</text>
  <text x="170" y="276" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Bile Synthesis</text>
  <line x1="230" y1="265" x2="280" y2="265" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Gallbladder (Small Green Pear under liver) -->
  <ellipse cx="340" cy="310" rx="14" ry="20" fill="#15803d" stroke="#22c55e" stroke-width="2" transform="rotate(30, 340, 310)"/>
  <text x="210" y="340" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#4ade80">Gallbladder</text>
  <line x1="270" y1="335" x2="330" y2="315" stroke="#4ade80" stroke-width="1.5"/>

  <!-- Stomach (J-shaped gastric reservoir) -->
  <path d="M 400,210 C 450,205 490,230 495,280 C 500,330 460,360 410,345 C 385,335 390,300 400,270 Z" fill="#991b1b" stroke="#ef4444" stroke-width="3"/>
  <text x="540" y="260" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f87171">Stomach</text>
  <text x="540" y="276" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">HCl Acid &amp; Pepsin</text>
  <line x1="535" y1="265" x2="480" y2="265" stroke="#f87171" stroke-width="1.5"/>

  <!-- Pancreas (Retroperitoneal Gland behind/under stomach) -->
  <path d="M 370,340 C 410,330 450,340 470,350 L 460,365 C 430,355 390,350 370,360 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
  <text x="540" y="345" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#facc15">Pancreas</text>
  <line x1="535" y1="345" x2="465" y2="350" stroke="#facc15" stroke-width="1.5"/>

  <!-- Large Intestine / Colon (Framing perimeter) -->
  <path d="M 320,490 L 320,380 C 320,370 480,370 480,380 L 480,490 C 480,520 450,540 410,540 L 410,560" fill="none" stroke="#059669" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Colon haustra ridges -->
  <path d="M 320,490 L 320,380 C 320,370 480,370 480,380 L 480,490 C 480,520 450,540 410,540 L 410,560" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="540" y="420" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#34d399">Large Intestine (Colon)</text>
  <text x="540" y="436" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Water Absorption</text>
  <line x1="535" y1="425" x2="495" y2="425" stroke="#34d399" stroke-width="1.5"/>

  <!-- Small Intestine (Central coiled loops) -->
  <rect x="345" y="395" width="110" height="110" rx="15" fill="#ca8a04" fill-opacity="0.3" stroke="#eab308" stroke-width="2"/>
  <path d="M 355,420 Q 380,405 400,420 T 445,420 M 355,445 Q 380,430 400,445 T 445,445 M 355,470 Q 380,455 400,470 T 445,470" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  <text x="180" y="450" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#facc15">Small Intestine</text>
  <text x="180" y="466" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Duodenum, Jejunum, Ileum</text>
  <line x1="270" y1="455" x2="345" y2="455" stroke="#facc15" stroke-width="1.5"/>

  <!-- Appendix -->
  <path d="M 320,500 L 305,520" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
  <text x="230" y="525" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#fb7185">Appendix</text>
  <line x1="280" y1="520" x2="305" y2="515" stroke="#fb7185" stroke-width="1.5"/>


  <!-- Footer Watermark / Standard Info -->
  <line x1="30" y1="565" x2="770" y2="565" stroke="#334155" stroke-width="1" />
  <text x="40" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">AI Spatial Learning Platform • Curated Educational Reference Series</text>
  <text x="760" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Standard Syllabus Geometry</text>
</svg>