<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="20" width="740" height="52" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">PLANT CELL ORGANELLES</text>
  <text x="50" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Cytology &amp; Cellular Biology • Eukaryotic Plant Structure • 2D Textbook Schematic Reference</text>
  <rect x="680" y="32" width="75" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="717" y="49" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">TEXTBOOK</text>

  <!-- Main Diagram Graphics -->
  
  <!-- Outer Cell Wall (Hexagonal / Heptagonal rigid matrix) -->
  <polygon points="400,105 600,160 670,340 580,490 380,510 200,430 170,250 250,130" fill="#14532d" stroke="#22c55e" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Cell Membrane (Plasma Membrane inner layer) -->
  <polygon points="400,120 585,170 650,335 565,475 385,495 215,420 190,255 260,145" fill="#064e3b" stroke="#86efac" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Cytosol / Cytoplasm Base -->
  <polygon points="400,125 580,175 645,330 560,470 385,490 220,415 195,260 265,150" fill="#022c22"/>

  <!-- Large Central Vacuole (Water &amp; Turgor pressure) -->
  <path d="M 360,200 C 470,180 550,220 540,320 C 530,420 450,440 370,430 C 310,420 290,340 310,260 C 320,220 340,205 360,200 Z" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="420" y="320" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#bae6fd" text-anchor="middle">Central Vacuole</text>
  <text x="420" y="338" font-family="'Segoe UI', sans-serif" font-size="10" fill="#7dd3fc" text-anchor="middle">Tonoplast • Turgor Pressure</text>

  <!-- Nucleus and Nucleolus -->
  <circle cx="280" cy="230" r="50" fill="#581c87" stroke="#c084fc" stroke-width="3"/>
  <circle cx="275" cy="225" r="20" fill="#3b0764" stroke="#e9d5ff" stroke-width="2"/>
  <text x="110" y="190" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#d8b4fe">Nucleus &amp; Chromatin</text>
  <line x1="175" y1="195" x2="245" y2="215" stroke="#d8b4fe" stroke-width="1.5"/>

  <!-- Chloroplasts with Grana (Green Photosynthetic Plastids) -->
  <g transform="translate(480, 160) rotate(25)">
    <ellipse cx="0" cy="0" rx="35" ry="20" fill="#15803d" stroke="#4ade80" stroke-width="2"/>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#86efac" stroke-width="2"/>
    <line x1="-22" y1="2" x2="22" y2="2" stroke="#86efac" stroke-width="2"/>
    <line x1="-18" y1="9" x2="18" y2="9" stroke="#86efac" stroke-width="2"/>
  </g>
  <text x="630" y="160" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#4ade80">Chloroplast</text>
  <text x="630" y="175" font-family="'Segoe UI', sans-serif" font-size="10" fill="#86efac">Thylakoid Grana</text>
  <line x1="620" y1="170" x2="520" y2="175" stroke="#4ade80" stroke-width="1.5"/>

  <!-- Second Chloroplast -->
  <g transform="translate(230, 360) rotate(-40)">
    <ellipse cx="0" cy="0" rx="35" ry="20" fill="#15803d" stroke="#4ade80" stroke-width="2"/>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#86efac" stroke-width="2"/>
    <line x1="-22" y1="2" x2="22" y2="2" stroke="#86efac" stroke-width="2"/>
    <line x1="-18" y1="9" x2="18" y2="9" stroke="#86efac" stroke-width="2"/>
  </g>

  <!-- Mitochondria (ATP Cellular Respiration) -->
  <g transform="translate(520, 420) rotate(-15)">
    <ellipse cx="0" cy="0" rx="32" ry="18" fill="#b91c1c" stroke="#f87171" stroke-width="2"/>
    <path d="M -22,0 Q -10,-8 0,0 T 22,0" fill="none" stroke="#fecaca" stroke-width="2"/>
  </g>
  <text x="640" y="425" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f87171">Mitochondrion</text>
  <text x="640" y="440" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fca5a5">Cristae • ATP Synthesis</text>
  <line x1="630" y1="430" x2="555" y2="425" stroke="#f87171" stroke-width="1.5"/>

  <!-- Callouts for Cell Wall &amp; Membrane -->
  <text x="400" y="90" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#22c55e" text-anchor="middle">Rigid Cellulose Cell Wall</text>
  <line x1="400" y1="95" x2="400" y2="110" stroke="#22c55e" stroke-width="2"/>

  <text x="100" y="450" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#86efac">Plasma Membrane</text>
  <line x1="160" y1="445" x2="215" y2="425" stroke="#86efac" stroke-width="1.5"/>


  <!-- Footer Watermark / Standard Info -->
  <line x1="30" y1="565" x2="770" y2="565" stroke="#334155" stroke-width="1" />
  <text x="40" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">AI Spatial Learning Platform • Curated Educational Reference Series</text>
  <text x="760" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Standard Syllabus Geometry</text>
</svg>