<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="20" width="740" height="52" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">HUMAN RESPIRATORY SYSTEM</text>
  <text x="50" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Pulmonology &amp; Respiratory Anatomy • Trachea, Bronchi, Lungs &amp; Alveoli • 2D Textbook Schematic Reference</text>
  <rect x="680" y="32" width="75" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="717" y="49" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">TEXTBOOK</text>

  <!-- Main Diagram Graphics -->
  
  <!-- Nasal / Pharynx / Larynx upper tract -->
  <rect x="385" y="100" width="30" height="40" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
  <text x="440" y="125" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Larynx (Voice Box)</text>
  <line x1="435" y1="125" x2="415" y2="125" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Trachea (Windpipe with Cartilage C-Rings) -->
  <rect x="388" y="145" width="24" height="90" fill="#0284c7" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="388" y1="155" x2="412" y2="155" stroke="#e0f2fe" stroke-width="2"/>
  <line x1="388" y1="167" x2="412" y2="167" stroke="#e0f2fe" stroke-width="2"/>
  <line x1="388" y1="179" x2="412" y2="179" stroke="#e0f2fe" stroke-width="2"/>
  <line x1="388" y1="191" x2="412" y2="191" stroke="#e0f2fe" stroke-width="2"/>
  <line x1="388" y1="203" x2="412" y2="203" stroke="#e0f2fe" stroke-width="2"/>
  <line x1="388" y1="215" x2="412" y2="215" stroke="#e0f2fe" stroke-width="2"/>
  <line x1="388" y1="227" x2="412" y2="227" stroke="#e0f2fe" stroke-width="2"/>
  <text x="240" y="190" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">Trachea (Cartilage Rings)</text>
  <line x1="335" y1="190" x2="385" y2="190" stroke="#7dd3fc" stroke-width="1.5"/>

  <!-- Primary Bronchi Bifurcation -->
  <path d="M 400,235 L 340,280 L 325,270 L 390,230 L 400,235 Z" fill="#0284c7" stroke="#0ea5e9" stroke-width="1.5"/>
  <path d="M 400,235 L 460,280 L 475,270 L 410,230 L 400,235 Z" fill="#0284c7" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="400" y="260" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#bae6fd" text-anchor="middle">Carina Bifurcation</text>

  <!-- Right Lung (3 Lobes: Superior, Middle, Inferior) -->
  <path d="M 330,260 C 270,240 210,290 200,380 C 195,440 240,480 330,480 C 340,480 345,430 345,380 C 345,310 340,280 330,260 Z" fill="#0f766e" stroke="#14b8a6" stroke-width="3"/>
  <!-- Fissures dividing 3 lobes -->
  <line x1="205" y1="360" x2="340" y2="350" stroke="#0d9488" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="210" y1="410" x2="335" y2="420" stroke="#0d9488" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="120" y="340" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2dd4bf">Right Lung</text>
  <text x="120" y="356" font-family="'Segoe UI', sans-serif" font-size="10" fill="#99f6e4">3 Lobes (Sup, Mid, Inf)</text>
  <line x1="170" y1="350" x2="220" y2="360" stroke="#2dd4bf" stroke-width="1.5"/>

  <!-- Left Lung (2 Lobes with Cardiac Notch for Heart) -->
  <path d="M 470,260 C 530,240 590,290 600,380 C 605,440 560,480 470,480 C 460,480 455,460 450,420 C 440,380 440,350 455,320 C 460,290 465,270 470,260 Z" fill="#0f766e" stroke="#14b8a6" stroke-width="3"/>
  <!-- Oblique fissure -->
  <line x1="465" y1="330" x2="595" y2="410" stroke="#0d9488" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="630" y="340" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2dd4bf">Left Lung</text>
  <text x="630" y="356" font-family="'Segoe UI', sans-serif" font-size="10" fill="#99f6e4">2 Lobes + Cardiac Notch</text>
  <line x1="620" y1="350" x2="570" y2="360" stroke="#2dd4bf" stroke-width="1.5"/>

  <!-- Cardiac Notch Label -->
  <path d="M 445,380 C 435,390 435,410 445,420" fill="none" stroke="#f43f5e" stroke-width="3"/>
  <text x="440" y="445" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#fb7185" text-anchor="middle">Cardiac Notch</text>

  <!-- Diaphragm Dome -->
  <path d="M 170,510 C 250,475 350,470 400,475 C 450,470 550,475 630,510" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <text x="400" y="525" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">Muscular Diaphragm Dome</text>

  <!-- Alveolar Cluster Inset Box -->
  <rect x="620" y="190" width="140" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="690" y="210" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Alveoli (Gas Exchange)</text>
  <circle cx="665" cy="240" r="14" fill="#f43f5e" fill-opacity="0.7" stroke="#fda4af" stroke-width="1.5"/>
  <circle cx="685" cy="235" r="12" fill="#3b82f6" fill-opacity="0.7" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="680" cy="255" r="13" fill="#f43f5e" fill-opacity="0.7" stroke="#fda4af" stroke-width="1.5"/>
  <circle cx="700" cy="250" r="11" fill="#3b82f6" fill-opacity="0.7" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="690" y="278" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">O2 Inflow • CO2 Outflow</text>


  <!-- Footer Watermark / Standard Info -->
  <line x1="30" y1="565" x2="770" y2="565" stroke="#334155" stroke-width="1" />
  <text x="40" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">AI Spatial Learning Platform • Curated Educational Reference Series</text>
  <text x="760" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Standard Syllabus Geometry</text>
</svg>