<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="20" width="740" height="52" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">SOLAR SYSTEM PLANETARY ORBITS</text>
  <text x="50" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Astronomy &amp; Astrophysics • Heliocentric Planetary Alignment &amp; Scaled Orbits • 2D Textbook Schematic Reference</text>
  <rect x="680" y="32" width="75" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="717" y="49" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">TEXTBOOK</text>

  <!-- Main Diagram Graphics -->
  
  <!-- Radiant Central Sun -->
  <circle cx="100" cy="320" r="55" fill="#f59e0b" stroke="#fde047" stroke-width="4" filter="url(#glow)"/>
  <text x="100" y="325" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#451a03" text-anchor="middle">SUN</text>
  <text x="100" y="395" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fde047" text-anchor="middle">G-Type Star (99.8% Mass)</text>

  <!-- Orbital Ellipses arcs -->
  <path d="M 190,140 C 230,230 230,410 190,500" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 250,120 C 300,220 300,420 250,520" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 320,100 C 380,210 380,430 320,540" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 390,90 C 460,200 460,440 390,550" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- 1. Mercury -->
  <circle cx="205" cy="320" r="7" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="205" y="295" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Mercury</text>

  <!-- 2. Venus -->
  <circle cx="265" cy="320" r="11" fill="#ea580c" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="265" y="290" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fb923c" text-anchor="middle">Venus</text>

  <!-- 3. Earth &amp; Moon -->
  <circle cx="335" cy="320" r="13" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="347" cy="305" r="3" fill="#cbd5e1"/>
  <text x="335" y="285" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Earth</text>
  <text x="335" y="350" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">1.0 AU</text>

  <!-- 4. Mars -->
  <circle cx="410" cy="320" r="9" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="410" y="295" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">Mars</text>

  <!-- Asteroid Belt -->
  <line x1="450" y1="120" x2="450" y2="520" stroke="#64748b" stroke-width="3" stroke-dasharray="2,6"/>
  <text x="450" y="110" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Asteroid Belt</text>

  <!-- 5. Jupiter (Gas Giant with Great Red Spot) -->
  <circle cx="515" cy="320" r="28" fill="#d97706" stroke="#fde68a" stroke-width="2.5"/>
  <circle cx="525" cy="328" r="6" fill="#b45309"/>
  <text x="515" y="275" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle">Jupiter</text>
  <text x="515" y="365" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Gas Giant</text>

  <!-- 6. Saturn (With Iconic Rings) -->
  <g transform="translate(605, 320)">
    <circle cx="0" cy="0" r="22" fill="#ca8a04" stroke="#fef08a" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="42" ry="12" fill="none" stroke="#fde047" stroke-width="3.5" transform="rotate(-20)"/>
  </g>
  <text x="605" y="275" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#facc15" text-anchor="middle">Saturn</text>
  <text x="605" y="365" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Planetary Rings</text>

  <!-- 7. Uranus -->
  <circle cx="685" cy="320" r="16" fill="#06b6d4" stroke="#a5f3fc" stroke-width="2"/>
  <ellipse cx="685" cy="320" rx="22" ry="6" fill="none" stroke="#67e8f9" stroke-width="1.5" transform="rotate(75, 685, 320)"/>
  <text x="685" y="285" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#22d3ee" text-anchor="middle">Uranus</text>

  <!-- 8. Neptune -->
  <circle cx="745" cy="320" r="15" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
  <text x="745" y="285" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">Neptune</text>
  <text x="745" y="350" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Ice Giant</text>


  <!-- Footer Watermark / Standard Info -->
  <line x1="30" y1="565" x2="770" y2="565" stroke="#334155" stroke-width="1" />
  <text x="40" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">AI Spatial Learning Platform • Curated Educational Reference Series</text>
  <text x="760" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Standard Syllabus Geometry</text>
</svg>