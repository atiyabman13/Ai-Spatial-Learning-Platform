<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Header Banner -->
  <rect x="30" y="20" width="740" height="52" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">HUMAN BRAIN CEREBRAL LOBES</text>
  <text x="50" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">Neuroanatomy • Lateral Hemispheric View of Cerebral Cortex • 2D Textbook Schematic Reference</text>
  <rect x="680" y="32" width="75" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="717" y="49" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">TEXTBOOK</text>

  <!-- Main Diagram Graphics -->
  
  <!-- Cerebral Cortex Lobes Profile -->

  <!-- Frontal Lobe (Executive, Blue) -->
  <path d="M 380,140 C 310,140 240,170 200,240 C 170,290 180,340 240,350 C 270,355 310,345 350,335 L 365,220 Z" fill="#1d4ed8" stroke="#3b82f6" stroke-width="3"/>
  <text x="140" y="210" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#60a5fa">Frontal Lobe</text>
  <text x="140" y="226" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd">Motor Control • Reasoning</text>
  <line x1="195" y1="230" x2="250" y2="245" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- Parietal Lobe (Sensory, Green) -->
  <path d="M 380,140 C 450,145 520,175 550,230 L 460,270 L 365,220 Z" fill="#047857" stroke="#10b981" stroke-width="3"/>
  <text x="440" y="110" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">Parietal Lobe</text>
  <text x="440" y="126" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">Somatosensory Processing</text>
  <line x1="440" y1="130" x2="440" y2="170" stroke="#34d399" stroke-width="1.5"/>

  <!-- Occipital Lobe (Vision, Purple) -->
  <path d="M 550,230 C 590,265 600,330 560,370 L 490,340 L 460,270 Z" fill="#6b21a8" stroke="#a855f7" stroke-width="3"/>
  <text x="640" y="290" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#c084fc">Occipital Lobe</text>
  <text x="640" y="306" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e9d5ff">Visual Cortex Processing</text>
  <line x1="630" y1="295" x2="575" y2="300" stroke="#c084fc" stroke-width="1.5"/>

  <!-- Temporal Lobe (Auditory/Memory, Orange) -->
  <path d="M 350,335 C 320,345 280,360 300,410 C 320,440 430,440 470,390 L 490,340 L 365,220 Z" fill="#c2410c" stroke="#f97316" stroke-width="3"/>
  <text x="160" y="400" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fb923c">Temporal Lobe</text>
  <text x="160" y="416" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fed7aa">Auditory • Language • Memory</text>
  <line x1="240" y1="405" x2="310" y2="400" stroke="#fb923c" stroke-width="1.5"/>

  <!-- Cerebellum (Coordination, Pink-Red striped) -->
  <path d="M 480,410 C 530,395 570,420 560,475 C 540,515 470,510 440,470 L 470,430 Z" fill="#9f1239" stroke="#f43f5e" stroke-width="2.5"/>
  <path d="M 460,450 C 490,440 520,450 540,460 M 460,470 C 485,465 510,470 535,480" fill="none" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="620" y="470" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fb7185">Cerebellum</text>
  <text x="620" y="486" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fecdd3">Motor Balance &amp; Coordination</text>
  <line x1="610" y1="475" x2="550" y2="475" stroke="#fb7185" stroke-width="1.5"/>

  <!-- Brainstem (Pons &amp; Medulla, Gray) -->
  <path d="M 420,440 C 400,470 410,540 420,560 L 445,560 C 445,520 440,465 440,440 Z" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="585" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">Brainstem (Pons &amp; Medulla)</text>

  <!-- Central Sulcus Divider Line -->
  <path d="M 380,140 L 365,220 L 350,335" fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="310" y="160" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#facc15">Central Sulcus</text>


  <!-- Footer Watermark / Standard Info -->
  <line x1="30" y1="565" x2="770" y2="565" stroke="#334155" stroke-width="1" />
  <text x="40" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b">AI Spatial Learning Platform • Curated Educational Reference Series</text>
  <text x="760" y="582" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Standard Syllabus Geometry</text>
</svg>