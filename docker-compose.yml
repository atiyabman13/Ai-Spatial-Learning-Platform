version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7-jammy
    container_name: ai_spatial_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai_spatial_platform
    volumes:
      - mongodb_data:/data/db

  # Node.js Express & Socket.IO Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_spatial_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/ai_spatial_platform
      JWT_SECRET: ***REMOVED***
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/uploads

  # Nginx Frontend Web Server & Reverse Proxy Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_spatial_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  uploads_data:
